{% extends "base.html" %}
{% block title %}Register - Menz Hut{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>
    {% if messages %}
        <ul class="mb-4">
            {% for message in messages %}
                <li class="text-red-600">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" class="block mb-1 font-semibold">Username</label>
            <input type="text" name="username" id="username" class="w-full px-4 py-2 border rounded" required>
        </div>
        <div class="mb-4">
            <label for="password" class="block mb-1 font-semibold">Password</label>
            <input type="password" name="password" id="password" class="w-full px-4 py-2 border rounded" required>
        </div>
        <div class="mb-4">
            <label for="confirm_password" class="block mb-1 font-semibold">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="w-full px-4 py-2 border rounded" required>
        </div>
        <div class="mb-6">
            <label for="address" class="block mb-1 font-semibold">Address</label>
            <textarea name="address" id="address" class="w-full px-4 py-2 border rounded" required></textarea>
        </div>
        <button type="submit" class="w-full bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700">Register</button>
    </form>
    <div class="mt-4 text-center">
        <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Already have an account? Log In</a>
    </div>
</div>
{% endblock %}
