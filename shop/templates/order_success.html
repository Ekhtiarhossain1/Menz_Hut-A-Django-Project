{% extends "base.html" %}
{% load static %}
{% block title %}Order Placed - Menz Hut{% endblock %}
{% block css %}
<style>
    .order-success {
        max-width: 500px;
        margin: 60px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.09);
        padding: 40px 30px;
        text-align: center;
    }
    .order-success .icon {
        font-size: 60px;
        color: #e60000;
        margin-bottom: 18px;
        display: block;
    }
    .order-success h2 {
        font-size: 2rem;
        color: #222;
        margin-bottom: 12px;
        font-family: 'Open Sans', cursive, sans-serif;
    }
    .order-success p {
        font-size: 1.15rem;
        color: #555;
        margin-bottom: 28px;
    }
    .continue-btn {
        background: #e60000;
        color: #fff;
        border: none;
        padding: 12px 32px;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: bold;
        text-decoration: none;
        transition: background 0.2s;
        box-shadow: 0 1px 6px rgba(0,0,0,0.07);
        display: inline-block;
    }
    .continue-btn:hover {
        background: #b30000;
    }
</style>
{% endblock %}
{% block content %}
<div class="order-success">
    <span class="icon">&#10004;</span>
    <h2>Thank you for your order!</h2>
    <p>Your order has been placed successfully.</p>
    <a href="{% url 'home' %}" class="continue-btn">Continue Shopping</a>
</div>
{% endblock %}
